version: '3.8'

services:
  # Flask Backend
  backend:
    build: .
    container_name: tender-api-backend
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: development
      DATABASE_URL: postgresql://tender_user:tender_password@db:5432/tender_db
      UPLOAD_FOLDER: /app/uploads/
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./uploads:/app/uploads
      - .:/app
    depends_on:
      - db
      - redis
    networks:
      - tender-network
    command: python app.py

  # PostgreSQL Database
  db:
    image: postgres:13-alpine
    container_name: tender-db
    environment:
      POSTGRES_USER: tender_user
      POSTGRES_PASSWORD: tender_password
      POSTGRES_DB: tender_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tender-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache/Message Broker
  redis:
    image: redis:7-alpine
    container_name: tender-redis
    networks:
      - tender-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin (Database Management - Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tender-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - tender-network

volumes:
  postgres_data:

networks:
  tender-network:
    driver: bridge
